spring.application.name=money-flow

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns the schema. Existing databases (created from the old creation.sql) adopt V1 as baseline.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.driverClassName=org.postgresql.Driver



# Persistent browser session (#24): refresh token lifetime and the Secure flag of its cookie
# (set AUTH_COOKIE_SECURE=false only for local http dev).
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

telegram.url=https://api.telegram.org/bot
telegram.timeout=15

spring.profiles.active=local
