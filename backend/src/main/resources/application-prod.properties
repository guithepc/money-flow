telegram.bot-token=${TELEGRAM_BOT_TOKEN}
jwt.secret=${JWT_SECRET}
# Access token lifetime in ms; the refresh cookie keeps the session alive beyond it.
jwt.expiration=${JWT_EXPIRATION:900000}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET}
telegram.bot-username=${TELEGRAM_BOT_USERNAME}


# Frontend base URL, used in links sent by the bot (password reset).
app.frontend-url=${APP_FRONTEND_URL:https://moneyflow.pctheone.com}
