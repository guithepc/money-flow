name: money-flow

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      SPRING_PROFILES_ACTIVE: prod
    labels:
      traefik.enable: "true"
      traefik.http.routers.money-flow-api.rule: "Host(`mf.pctheone.com`) && PathPrefix(`/api`)"
      traefik.http.routers.money-flow-api.entrypoints: websecure
      traefik.http.routers.money-flow-api.tls.certresolver: letsencrypt
      traefik.http.routers.money-flow-api.middlewares: waf@file,ratelimit@file,secheaders@file
      traefik.http.services.money-flow-api.loadbalancer.server.port: "8080"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [traefik_proxy, internal]

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.money-flow-front.rule: "Host(`mf.pctheone.com`)"
      traefik.http.routers.money-flow-front.entrypoints: websecure
      traefik.http.routers.money-flow-front.tls.certresolver: letsencrypt
      traefik.http.routers.money-flow-front.middlewares: ratelimit@file,secheaders@file
      traefik.http.services.money-flow-front.loadbalancer.server.port: "80"
    networks: [traefik_proxy]
    
networks:
  traefik_proxy:
    external: true
  internal:
    name: money_flow_internal
    internal: true

volumes:
  pgdata: